<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<title>Gus</title>
<link rel="icon" href="/icon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="icon" href="/icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Gus">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700;800&display=swap">
<script>try { const q = new URLSearchParams(location.search).get("theme"); if (q) localStorage.setItem("radar-theme", q); const t = localStorage.getItem("radar-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="/cockpit.css">
</head>
<body>
<div class="app">
  <nav id="nav">
    <div class="brand">g<span class="us">us</span><b>/</b><small>Your agent in the market</small></div>
    <a href="#roles" data-v="roles" data-i="01" title="Role Inbox"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l3-8h12l3 8v6H3zM3 13h6l1 2h4l1-2h6"/></svg><span class="lb">Role Inbox</span> <span class="n" id="n-roles"></span></a>
    <a href="#pipeline" data-v="pipeline" data-i="02" title="Pipeline"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h4v14H4zM10 5h4v9h-4zM16 5h4v5h-4z"/></svg><span class="lb">Pipeline</span> <span class="n" id="n-pipeline"></span></a>
    <a href="#week" data-v="week" data-i="03" title="To do"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 1.5-2M4 12l1 1 1.5-2M4 18l1 1 1.5-2"/></svg><span class="lb">To do</span> <span class="n" id="n-week"></span></a>
    <a href="#accounts" data-v="accounts" data-i="04" title="Companies"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V5h9v15M13 10h7v10M2 20h20M7 9h3M7 13h3"/></svg><span class="lb">Companies</span> <span class="n" id="n-accounts"></span></a>
    <a href="#health" data-v="health" data-i="05" title="Usage"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/></svg><span class="lb">Usage</span></a>
    <a href="#settings" data-v="settings" data-i="06" title="Settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span class="lb">Settings</span></a>
    <button class="nav-toggle" id="navToggle" onclick="toggleNav()"></button>
  </nav>
  <div class="content">
    <div class="ticker" id="ticker" aria-live="polite"></div>
    <div class="banner" id="banner" role="status" hidden></div>
    <div class="progress" id="progress" role="status" hidden></div>
    <main id="main"><div class="empty">Loading…</div></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
let S = { jobs: [], companies: {}, health: {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const link = u => /^https?:\/\//i.test(String(u ?? "").trim()) ? esc(String(u).trim()) : "#";  // never javascript: and friends
const band = s => s == null ? "none" : s >= 8 ? "hi" : s >= 5 ? "mid" : "lo";
const ago = iso => {
  if (!iso) return "never";
  const m = Math.round((Date.now() - new Date(iso)) / 6e4);
  return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 2880 ? Math.round(m / 60) + "h ago" : Math.round(m / 1440) + "d ago";
};
const DAY = 864e5;
let PIPE = ["shortlisted", "preparing", "applied", "interviewing", "closed"];  // the role stages on the board, refreshed from the server
const LABEL = { shortlisted: "To apply", preparing: "In prep", applied: "Applied", interviewing: "Interviewing", closed: "Finished" };

function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 1600 + t.length * 45); }

async function refreshState() {
  const r = await fetch("/api/state", { cache: "no-store" });
  if (r.ok) { S = await r.json(); drawTicker(); }
}
async function load() {
  const r = await fetch("/api/state", { cache: "no-store" });
  if (!r.ok) { $("main").innerHTML = `<div class="empty">${esc(await r.text())}</div>`; return; }
  S = await r.json(); checkRoleFilters();
  if (S.labels.role_stages) PIPE = S.labels.role_stages.filter(st => !["new", "skipped"].includes(st));
  if ((S.running || []).length) watchRun();
  if (S.setup.needed && location.hash !== "#welcome") location.hash = "#welcome";
  else if (location.hash === "#welcome" && !S.setup.can_run) location.hash = "#pipeline";
  render();
}
async function post(path, body) {
  let d;
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    d = await r.json();
  } catch (e) { toast("Not saved: Gus isn't answering. Try again in a moment"); return null; }  // restarting, or the connection dropped
  if (d.error) { toast(d.error); return null; }
  return d;
}
async function setStage(id, stage, msg) {
  const d = await post("/api/job", { id, stage });
  if (!d) return;
  Object.assign(S.jobs.find(j => j.id === id), d.job); toast(msg || "Moved to " + (LABEL[stage] || stage)); render();
}

const savedFilter = key => { try { return localStorage.getItem(key); } catch (e) { return null; } };
let roleWhere = savedFilter("gus-role-where");
let roleKind = savedFilter("gus-role-kind");
function checkRoleFilters() {  // places and types come from Settings, so a saved choice may no longer exist
  if (roleWhere !== "all" && !S.places.includes(roleWhere)) roleWhere = S.places[0] || "all";
  if (roleKind !== "all" && !S.kinds.includes(roleKind)) roleKind = "all";
}
let roleView = "new";
function saveRoleFilters() { try { localStorage.setItem("gus-role-where", roleWhere); localStorage.setItem("gus-role-kind", roleKind); } catch (e) {} }
const inView = (j, v) => v === "skipped" ? j.stage === "skipped" : v === "closed" ? !!j.ad_closed && j.stage !== "skipped"
  : j.stage === "new" && !j.ad_closed && (j.score == null || j.score >= 5 || (j.history || []).some(h => h.stage === "new"));
const roleMatch = (j, view, w, kind) => inView(j, view) && (w === "all" || j.where === w) && (kind === "all" || j.role_type === kind);
const newRoles = () => S.jobs.filter(j => roleMatch(j, roleView, roleWhere, roleKind))
  .sort((a, b) => (b.score ?? 11) - (a.score ?? 11) || b.first_seen.localeCompare(a.first_seen));
const peopleAt = name => Object.values(S.people).filter(p => p.company === name);
const daysAgo = n => n == null ? "undated" : n === 0 ? "today" : n + "d ago";
const sigChip = (e, edit) => `<span class="sig-wrap"><a class="sig ${e.fresh ? "fresh" : ""}" href="${link(e.url)}" target="_blank" rel="noopener" title="${esc(e.summary)}${e.source ? " · from " + esc(String(e.source).split(":")[0]) : ""}">
  <b>${esc(S.labels.events[e.type] || e.type)}</b> ${esc((e.summary || "").slice(0, 60))} <i>${daysAgo(e.age_days)}</i></a>${edit && e.id && e.type !== "role_posted" ? `<button class="mini x" title="Not news any more. It stops counting, and stays on record." aria-label="Dismiss" onclick="dismissEvent(${jsq(e.id)})">×</button>` : ""}</span>`;
const eventsAt = name => (S.events || []).filter(e => e.account === name && !e.closed);
const dist = p => p.distance || { label: "3rd+", certain: false, paths: [] };
const distBadge = p => { const d = dist(p);
  return `<span class="dist d${d.hops || 3} ${d.certain ? "sure" : ""}" title="${d.certain ? "Confirmed" : "Estimated from your connections, not confirmed"}">${esc(d.label)}</span>`; };
const personChip = p => `<a class="person-chip" href="${link(p.url)}" target="_blank" rel="noopener" title="${esc(dist(p).paths.map(x => x.detail).join(" · ") || p.evidence || "")}">
  ${distBadge(p)} <b>${esc(p.name)}</b> ${esc((p.role || p.kind || "").slice(0, 40))}${p.stage && p.stage !== "mapped" ? ` · ${esc(p.stage)}` : ""}</a>`;
function routes(p) {
  const d = dist(p), best = d.paths.slice(0, 3);
  return `<div class="routes"><div class="routes-head"><b>Distance</b> ${distBadge(p)}
      <span class="sub">${d.certain ? "confirmed" : d.paths.length ? "estimated" : "no route found"}</span></div>
    ${best.map(r => `<div class="route">${r.via && r.url ? `<a href="${link(r.url)}" target="_blank" rel="noopener">${esc(r.detail)}</a>` : esc(r.detail)}</div>`).join("")}
    <div class="row confirm"><span class="sub">On LinkedIn it says</span>
      <select aria-label="Degree shown on LinkedIn for ${esc(p.name)}" onchange="setDegree(${jsq(p.id)}, this.value)">
        <option value="">Not checked</option>${[[1, "1st"], [2, "2nd"], [3, "3rd+"]].map(([v, l]) => `<option value="${v}" ${p.degree === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      <input type="text" id="via-${esc(p.id)}" placeholder="Mutual connection" value="${esc(p.via || "")}" aria-label="Mutual connection" onchange="setDegree(${jsq(p.id)})" class="flex-1 min-w-[140px] max-w-[240px]"></div></div>`;
}
const usd = v => "$" + (v < 10 ? (v || 0).toFixed(2) : Math.round(v).toLocaleString());
const TASKS = { quick: "First look", scoring: "Scoring roles", people: "Mapping people", agent: "Agent runs", links: "Finding job links" };
function roleExtras(j) {
  const sent = p => (j.contacts || {})[p.id] || (S.moves.find(m => m.person_id === p.id && m.status === "done") || {}).done_at;
  const who = peopleAt(j.company).sort((a, b) => !!sent(b) - !!sent(a)).slice(0, 4).map(p => {
    const at = sent(p);
    return at ? `<div class="sub contact">Messaged <b>${esc(p.name)}</b> ${ago(at)} <button class="mini" onclick="roleContact(${jsq(j.id)}, ${jsq(p.id)}, false)" aria-label="Undo messaged ${esc(p.name)}">Undo</button></div>`
      : `<button class="mini" onclick="roleContact(${jsq(j.id)}, ${jsq(p.id)}, true)">Messaged ${esc(p.name)}</button>`;
  }).join("");
  return `<div class="extras">${j.folder
    ? `${/^https?:\/\//i.test(j.folder) ? `<a href="${link(j.folder)}" target="_blank" rel="noopener"><button class="mini">Open folder</button></a>` : `<button class="mini" onclick="copyPath(${jsq(j.folder)})">Copy folder path</button>`}<button class="mini" onclick="setFolder(${jsq(j.id)}, ${jsq(j.folder)})">Change</button>`
    : `<button class="mini" onclick="setFolder(${jsq(j.id)}, '')">Add folder</button>`}<button class="mini" onclick="roleDetails(${jsq(j.id)})">${j.source === "manual" ? "Details" : "Description"}</button>${who}</div>`;
}
async function roleDetails(id) {  // the description isn't in the page's data, so it's fetched when asked for
  const r = await fetch("/api/job?id=" + encodeURIComponent(id), { cache: "no-store" }).then(r => r.json()).catch(() => null);
  if (!r || r.error) { toast(r ? r.error : "Gus isn't answering. Try again in a moment"); return; }
  const j = r.job, mine = j.source === "manual";
  let d = $("role-dlg");
  if (!d) { d = Object.assign(document.createElement("dialog"), { id: "role-dlg" }); $("main").append(d); }  // inside the page, so a redraw takes it away with the card it belongs to
  d.innerHTML = `<div class="co">${esc(j.company)}</div>` + (mine
    ? `<div class="row mt-2"><input type="text" id="role-edit-title" aria-label="Edit title" value="${esc(j.title)}" class="flex-[2]"><input type="text" id="role-edit-location" aria-label="Edit location" placeholder="Location" value="${esc(j.location || "")}" class="flex-1"></div>
       <input type="text" id="role-edit-url" aria-label="Edit link" placeholder="Link to the ad (optional)" value="${esc(j.url || "")}" class="w-full mt-1.5">
       <textarea id="role-edit-description" aria-label="Edit description" placeholder="Paste the job description" rows="16" class="w-full mt-1.5">${esc(j.description || "")}</textarea>
       <div class="actions"><button class="primary" onclick="saveRole(${jsq(j.id)})">Save</button><button onclick="$('role-dlg').close()">Cancel</button>
       <span class="sub">Changing the description has Gus score it again on the next scan.</span></div>`
    : `<div class="title">${roleTitle(j, j.url)}</div><div class="sub">${esc(j.location || "")}</div>
       <div class="jd">${j.description ? esc(j.description) : `<span class="sub">${j.pruned ? "The description was cleared to save space once this role closed." : "No description saved."}</span>`}</div>
       <div class="actions"><button onclick="$('role-dlg').close()">Close</button></div>`);
  d.showModal();
}
async function saveRole(id) {
  const v = k => $("role-edit-" + k).value;
  if (await post("/api/job", { id, title: v("title"), location: v("location"), url: v("url"), description: v("description") })) { $("role-dlg").close(); toast("Saved"); await load(); render(true); }
}
async function roleContact(id, person_id, sent) { if (await post("/api/role-contact", { id, person_id, sent })) { toast(sent ? "Logged" : "Undone"); load(); } }
async function setFolder(id, current) {
  const folder = prompt("Link to this application's folder (any https:// address), or a path on your Mac:", current);
  if (folder === null) return;
  if (await post("/api/job", { id, folder })) { toast("Folder saved"); load(); }
}
async function copyPath(path) {
  const done = () => toast("Copied. In Finder, press Cmd+Shift+G and paste");
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(path).then(done);
  const a = Object.assign(document.createElement("textarea"), { value: path }); document.body.append(a); a.select(); document.execCommand("copy"); a.remove(); done();
}
function followUpsBlock() {
  const rows = S.follow_ups || [];
  if (!rows.length) return "";
  return `<div class="section">Follow up on applications · ${rows.length}</div>` + rows.map(r => `<article class="card">
    <div class="co">${esc(r.company)}</div>
    <div class="title">${esc(r.title)}</div>
    <div class="sub">Applied ${r.days == null ? "recently" : r.days === 0 ? "today" : r.days === 1 ? "yesterday" : r.days + " days ago"}</div>
    ${r.contacts.length ? r.contacts.map(c => `<div class="follow">
      <div><b><a href="${link(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a></b> ${S.people[c.id] ? distBadge(S.people[c.id]) : ""} <span class="sub">${esc(c.role || "")}</span></div>
      <div class="why-contact"><b>Why:</b> ${esc(c.reason)}.${c.confidence ? ` <span class="sub">${esc(c.confidence)} confidence</span>` : ""}</div>
      ${c.evidence ? `<div class="sub">${esc(c.evidence)}</div>` : ""}
      <div class="actions"><a href="${link(c.url)}" target="_blank" rel="noopener"><button class="mini">Open profile</button></a>
        <button class="mini" onclick="roleContact(${jsq(r.id)}, ${jsq(c.id)}, true)">Messaged</button></div></div>`).join("")
    : `<p class="sub">Gus hasn't found anyone at ${esc(r.company)} yet.</p>`}
  </article>`).join("");
}
function meetingsBlock() {
  const ms = S.meetings || [];
  if (!ms.length) return "";
  const when = s => { const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
  return `<div class="section">Meetings · ${ms.length}</div><table>${ms.map(m => `<tr>
    <td class="whitespace-nowrap"><b>${when(m.start)}</b></td>
    <td><b>${esc(m.title || "Meeting")}</b>${m.account ? ` <span class="sub">· ${esc(m.account)}</span>` : ""}<div class="sub">${esc(m.why || "")}${m.organizer ? " · " + esc(m.organizer) : ""}</div></td>
    <td class="hide-sm sub">${/^https?:/i.test(m.location || "") ? `<a href="${link(m.location)}" target="_blank" rel="noopener">Join</a>` : esc(m.location || "")}</td></tr>`).join("")}</table>`;
}
function costs() {
  const u = S.usage, max = Math.max(0.01, ...u.days.map(d => d.ai + d.x));
  const stat = (v, l) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  return `<h1>Usage</h1>
    <p class="lede">What Gus's AI runs have used, by day and by task. On a Claude plan, the Claude part isn't money you pay.</p>
    <div class="stats">${stat(usd(u.ai.today.cost_usd), "Claude today")}${stat(usd(u.ai.week.cost_usd), "Claude 7 days")}${stat(usd(u.ai.month.cost_usd), "Claude this month")}
      ${stat(S.usage.daily_limit ? usd(S.usage.daily_limit) : "AI off", "Daily limit")}${stat(u.ai.month.runs, "Runs this month")}${stat(u.ai.month.searches, "Searches this month")}${stat(usd(u.x.month.cost_usd), "X this month (est.)")}</div>
    <div class="section">Last 14 days</div>
    <div class="spark">${u.days.map(d => `<div title="${d.date}: ${usd(d.ai)} Claude, ${usd(d.x)} X"><i style="height:${Math.round((d.ai + d.x) / max * 100)}%"></i></div>`).join("")}</div>
    ${Object.keys(u.by_task).length ? `<div class="section">This month by task</div><table>${Object.entries(u.by_task).map(([k, v]) => `<tr><td><b>${esc(TASKS[k] || k)}</b></td><td>${v.runs} runs</td><td>${v.searches} searches</td><td>${usd(v.cost_usd)}</td></tr>`).join("")}</table>` : ""}
    ${u.recent.length ? `<div class="section">Latest</div><table>${u.recent.map(r => `<tr><td class="sub">${ago(r.at)}</td><td>${esc(r.kind === "x" ? "X" : TASKS[r.task] || r.task)}</td><td class="hide-sm sub">${esc(r.model || (r.posts + " posts"))}</td><td>${r.cost_usd == null ? "–" : usd(r.cost_usd)}</td></tr>`).join("")}</table>` : ""}
    <p class="sub mt-3">${u.first ? `Tracking since ${esc(u.first.slice(0, 10))}. ` : "Nothing recorded yet. "}Scheduled tasks in the desktop app aren't included, and the Claude app doesn't report how much of your Pro allowance is left.</p>`;
}
function moveCard(m) {
  const p = S.people[m.person_id] || { name: m.person_id }, a = S.accounts.find(x => x.name === m.account) || {};
  const sig = m.signal || {}, age = sig.date ? Math.round((Date.now() - new Date(sig.date)) / DAY) : null;
  const k = "mv" + m.id.replace(/[^a-z0-9]/gi, "");
  const outcome = m.status === "done" ? `<div class="row mt-3"><span class="sub">Outcome</span>
    <select onchange="setMove(${jsq(m.id)}, {outcome: this.value || null})" aria-label="Outcome">
      <option value="">No reply yet</option>${S.labels.outcomes.filter(o => o !== "no_reply").map(o => `<option value="${o}" ${m.outcome === o ? "selected" : ""}>${o.replace("_", " ")}</option>`).join("")}
    </select></div>` : "";
  return `<article class="card move ${m.status}">
    <div class="move-head"><div><span class="tier t${a.tier || "B"}">${a.tier || "?"}</span> <span class="co">${esc(m.account)}</span></div>
      <span class="pill ${m.status === "done" ? "done" : ""}">${m.status === "todo" ? esc(m.channel || "linkedin") : m.status}</span></div>
    <div class="title"><a href="${link(p.url || "#")}" target="_blank" rel="noopener">${esc(p.name)}</a> ${p.id ? distBadge(p) : ""} <span class="sub">${esc(p.role || "")}</span></div>
    <div class="chips">${sigChip({ ...sig, fresh: age != null && age <= 30, age_days: age })}</div>
    <p class="why"><b>Why now.</b> ${esc(m.why_now)}</p>
    <p class="why"><b>Angle.</b> ${esc(m.angle)}</p>
    ${m.give_first ? `<p class="why"><b>Give first.</b> ${esc(m.give_first)}</p>` : ""}
    ${p.id ? routes(p) : ""}
    <div class="msg" id="${k}">${esc(m.draft)}</div>
    <div class="actions">
      <button onclick="copyText('${k}')">Copy draft</button>
      <a href="${link(p.url || "#")}" target="_blank" rel="noopener"><button>Open profile</button></a>
      ${m.status === "todo" ? `<button class="primary" onclick="setMove(${jsq(m.id)}, {status:'done'})">Sent</button>
        <button onclick="setMove(${jsq(m.id)}, {status:'skipped'})">Skip</button>` : `<button onclick="setMove(${jsq(m.id)}, {status:'todo', outcome:null})">Undo</button>`}
    </div>${outcome}</article>`;
}

// A chip's number is what the list would show if you picked it, with the other filters left as they are.
function chipRow(label, options, value, name) {
  return `<div class="tabs chips-row" role="group" aria-label="${label}">${options.map(([v, l]) => {
    const n = S.jobs.filter(j => roleMatch(j, name === "roleView" ? v : roleView, name === "roleWhere" ? v : roleWhere, name === "roleKind" ? v : roleKind)).length;
    return `<a href="#roles" class="${v === value ? "on" : ""}" onclick="event.preventDefault();${name}=${jsq(v)};saveRoleFilters();render(true)">${l} <span class="sub">${n}</span></a>`;
  }).join("")}</div>`;
}
const SOURCE_LABEL = { adzuna: "Adzuna", jsearch: "JSearch" };
const limitLine = (s, r) => `<tr><td><b>${esc(s.label)}</b> ${esc(r.period)}${r.left <= 0 ? ' <span class="flag">At limit</span>' : ""}</td><td>${r.used} of ${r.limit} used</td><td>${r.left} left</td><td class="sub">Resets ${esc(r.resets)}${r.exact ? "" : " (estimate)"}</td></tr>`;
const sourcesDue = list => (list || []).filter(s => s.on).map(s => ` ${s.label} next due: ${s.next_run || "now"}.`).join("");
function sourceLimits(list) {
  const on = (list || []).filter(s => s.on || s.limits.some(r => r.used));
  const warned = (list || []).flatMap(s => s.on ? s.warnings : []);
  if (!on.length) return `<div class="sub">No job sources turned on yet.</div>`;

    const PS = S.labels.person_stages.filter(s => s !== "mapped");
    const ppl = Object.values(S.people).filter(p => p.stage && p.stage !== "mapped");
    const peopleBoard = PS.map(st => { const rows = ppl.filter(p => p.stage === st);
      return `<div class="col"><h3>${st} <span>${rows.length}</span></h3>${rows.map(p => `<div class="card">
        <div class="co">${esc(p.company)}</div><div class="title"><a href="${link(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a></div>
        <div class="sub">${distBadge(p)} ${esc(p.role || "")}</div>
        <select onchange="setPerson(${jsq(p.id)}, this.value)" aria-label="Stage">${S.labels.person_stages.map(s => `<option ${s === st ? "selected" : ""}>${s}</option>`).join("")}</select></div>`).join("")}</div>`; }).join("");
    const appBoard = PIPE.map(st => {
      const rows = S.jobs.filter(j => j.stage === st).sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
      return `<div class="col"><h3>${LABEL[st]} <span>${rows.length}</span></h3>` + rows.map(j => {
        const since = (j.history || []).filter(h => h.stage === st).pop();
        return `<div class="card"><div class="co">${esc(j.company)} · ${j.score ?? "–"}</div>
          <div class="title">${roleTitle(j, j.url)}</div>
          ${since ? `<div class="sub">since ${ago(since.at)}</div>` : ""}
          ${j.ad_closed ? `<div class="sub"><span class="pill due">Ad closed</span></div>` : ""}
          ${j.readvertised ? `<div class="sub"><span class="pill warm">Advertised again ${ago(j.readvertised)}</span></div>` : ""}
          <select onchange="setStage(${jsq(j.id)}, this.value)" aria-label="Stage">
          ${[...PIPE, "skipped"].map(s => `<option value="${s}" ${s === st ? "selected" : ""}>${LABEL[s] || "Skipped"}</option>`).join("")}</select>
          ${roleExtras(j)}</div>`;
      }).join("") + `</div>`; }).join("");
    return `<h1>Pipeline</h1><p class="lede">Every conversation and application, by stage. Move a card on as things happen.</p>
      ${meetingsBlock()}
      <details class="add-event keep m-0 mb-3"><summary class="sub">+ Add a role</summary>
        <div class="row mt-1.5"><input type="text" id="add-role-company" placeholder="Company" aria-label="Company" class="flex-1">
          <input type="text" id="add-role-title" placeholder="Role title" aria-label="Role title" class="flex-[2]">
          <input type="text" id="add-role-location" placeholder="Location" aria-label="Location" class="flex-1"></div>
        <div class="row mt-1.5"><input type="text" id="add-role-url" placeholder="Link to the ad (optional)" aria-label="Link to the ad" class="flex-[2]">
          <input type="text" id="add-role-careers" placeholder="Company careers page (optional)" aria-label="Company careers page" class="flex-[2]">
          <input type="text" id="add-role-folder" placeholder="Application folder (optional)" aria-label="Application folder" class="flex-[2]">
          <select id="add-role-stage" aria-label="Starting stage">${PIPE.filter(s => s !== "closed").map(s => `<option value="${s}">${LABEL[s]}</option>`).join("")}</select></div>
        <textarea id="add-role-description" rows="6" placeholder="Paste the job description" aria-label="Job description" class="w-full mt-1.5"></textarea>
        <div class="row mt-1.5"><button class="primary" id="add-role-go" onclick="addRole()">Add role</button>
          <span class="sub">For a role that reached you directly, from a recruiter say. Gus scores it, and never skips or closes it for you. A company new to Gus is added too, with its job board if it has a public one.</span></div></details>
      ${ppl.length || S.jobs.some(j => PIPE.includes(j.stage)) ? "" : `<div class="empty">Nothing in your pipeline yet. Shortlist a role and it appears here.<div class="actions justify-center">${newRoles().length ? `<button class="primary" onclick="location.hash='roles'">See new roles</button>` : `<button class="primary" onclick="startRun('run')">Full run</button>`}</div></div>`}
      <div class="section">Conversations</div><div class="board">${peopleBoard}</div>
      <div class="section">Applications</div><div class="board">${appBoard}</div>`;
  },
  roles() {
    const rows = newRoles();
    return `<h1>Role Inbox <span class="count">${rows.length}</span></h1><p class="lede">New roles scored against your profile, best first. Shortlist the ones you'd apply for and skip the rest.</p>
      ${getStarted()}
      ${chipRow("Show", [["new", "New"], ["closed", "Closed ads"], ["skipped", "Skipped"]], roleView, "roleView")}
      ${chipRow("Where", [...S.places.map(p => [p, esc(p)]), ["all", "All"]], roleWhere, "roleWhere")}
      ${S.kinds.length ? chipRow("Type", [["all", "All"], ...S.kinds.map(k => [k, esc(k)])], roleKind, "roleKind") : ""}
      <p class="hint" ${roleView === "new" ? "" : "hidden"}><kbd>J</kbd> <kbd>K</kbd> move · <kbd>S</kbd> shortlist · <kbd>X</kbd> skip · <kbd>O</kbd> open</p>` +
      (rows.length ? (roleView === "new" ? inboxGroups(rows).map(g => {
        const card = ({ j, also }) => {
          const rest = also.map(v => v.id), all = jsa([j.id, ...rest]);
          return roleCard(j, `
        <button class="primary" onclick="${rest.length ? `setMany([${jsq(j.id)}],'shortlisted','Moved to To apply').then(() => setMany(${jsa(rest)},'skipped','Shortlisted, and its other locations set aside'))` : `setStage(${jsq(j.id)},'shortlisted')`}">Shortlist</button>
        <button onclick="location.hash='accounts';window._acctq=${jsq(j.company)}">Company</button>
        <button onclick="${rest.length ? `setMany(${all},'skipped','Skipped in every location')` : `setStage(${jsq(j.id)},'skipped','Skipped')`}">Skip</button>`, alreadyHere(j) + alsoIn(also));
        };
        const many = g.entries.length >= GROUP_FROM, open = openCo.has(g.key), hidden = g.entries.length - 1;
        const ids = jsa(g.entries.flatMap(e => [e.j.id, ...e.also.map(v => v.id)]));
        return (many && !open ? card(g.entries[0]) : g.entries.map(card).join("")) + (many ? `<div class="more">
          <button onclick="toggleCo(${jsq(g.key)})">${open ? `Show only the best at ${esc(g.company)}` : `+${hidden} more at ${esc(g.company)}`}</button>
          <button onclick="if(confirm('Skip all ${g.entries.length} roles at ' + ${jsq(g.company)} + '?'))setMany(${ids},'skipped','Skipped all at ' + ${jsq(g.company)})">Skip all ${g.entries.length}</button></div>` : "");
      }).join("") : rows.map(j => roleCard(j, roleView === "skipped" ? `
        <span class="sub">${(j.history || []).some(h => h.stage === "skipped") ? "You skipped this" : "Gus skipped this: it scored under 5"}</span>
        <button onclick="setStage(${jsq(j.id)},'new','Restored to New')">Restore</button>` : `
        <span class="sub">Ad closed ${ago(j.ad_closed)}${j.stage !== "new" ? " · " + esc(j.stage) : ""}</span>`)).join(""))
      : `<div class="empty">${roleView === "new" ? "You're up to date. New roles appear here as Gus finds them." : roleView === "skipped" ? "Nothing skipped here." : "No closed ads here."}</div>`);
  },
  settings() {
    if (!SET) { loadSettings(); return `<div class="empty">Loading settings…</div>`; }
    const tab = (location.hash.split("/")[1] || "ai");
    const tabs = SETTINGS_TABS.map(([k, l]) => `<a href="#settings/${k}" class="${k === tab ? "on" : ""}">${l}</a>`).join("");
    const body = (SETTINGS_TABS.find(t => t[0] === tab) || SETTINGS_TABS[0])[2]();
    return `<h1>Settings</h1><p class="lede">What Gus looks for, where, and how it runs. Changes save by themselves.</p>
      <div class="tabs" role="tablist">${tabs}</div>${body}`;
  },
  health() {
    const h = S.health, errs = Object.entries(h.board_errors || {}), feedErrs = Object.entries(h.feed_errors || {});
    return costs() + `<div class="section">Health</div>
      <div class="stats">
        <div class="stat"><div class="v">${ago(h.last_scan)}</div><div class="l">Last scan</div></div>
        <div class="stat"><div class="v">${h.last_agent_run ? ago(h.last_agent_run) : "never"}</div><div class="l">Last agent run</div></div>
        <div class="stat"><div class="v">${h.boards}</div><div class="l">Boards scanned</div></div>
        <div class="stat"><div class="v">${S.jobs.length}</div><div class="l">Roles tracked</div></div>
        <div class="stat"><div class="v">${h.signals_waiting}</div><div class="l">Signals waiting</div></div>
        <div class="stat"><div class="v">${h.x && h.x.day ? (h.x.used || 0) : "off"}</div><div class="l">X posts today</div></div>
        <div class="stat"><div class="v">${signedOut() ? "Sign-in expired" : S.ai.paused ? "Paused" : "Ready"}</div><div class="l">AI</div></div>
        <div class="stat"><div class="v">${h.claude.last_used ? ago(h.claude.last_used) : "never"}</div><div class="l">Claude last connected${h.claude.refused ? ` · ${h.claude.refused} refused` : ""}${h.claude.token && h.claude.token.old ? " · token is old" : ""}</div></div>
      </div>
      ${signedOut() ? `<div class="section">AI</div><p class="bad">Your Claude sign-in expired ${ago(S.ai.signed_out_since)}. Nothing that needs AI has worked since, and roles found since then have no score.</p>
      <div class="row"><button class="primary" onclick="signIn('health-login')">Sign in with Claude</button></div><div id="health-login"></div>` : ""}
      <div class="section">Job source limits</div>${sourceLimits(h.sources)}
      <div class="section">Board errors</div>
      ${errs.length ? `<table>${errs.map(([n, e]) => `<tr><td><b>${esc(n)}</b></td><td class="sub">${esc(e)}</td></tr>`).join("")}</table>` : `<div class="sub">Every job board worked on the last check.</div>`}
      <div class="section">Feed errors</div>
      ${feedErrs.length ? `<table>${feedErrs.map(([n, e]) => `<tr><td><b>${esc(n)}</b></td><td class="sub">${esc(e)}</td></tr>`).join("")}</table>` : `<div class="sub">Every feed worked on its last check.</div>`}`;
  },
};

let SET = null;
const fieldRow = f => `<div class="field"><label for="f_${f.key}">${esc(f.label)}</label>
  <div>${input(f, SET.values[f.key])}</div>${f.help ? `<div class="help">${esc(f.help)}</div>` : ""}</div>`;
const AI_KEYS = { anthropic_api: "anthropic_api_key", openai_compatible: "openai_api_key" };
const secretField = ([k, s]) => `<div class="field"><label for="s_${k}">${esc(s.label)}</label>
      <div class="row"><input type="password" id="s_${k}" placeholder="${SET.secrets[k] ? esc(SET.secrets[k]) : "Not set"}" autocomplete="off" class="flex-1 min-w-[160px]">
      <button onclick="saveSecret('${k}')">Save</button>${SET.secrets[k] ? `<button onclick="$('s_${k}').value='';saveSecret('${k}')">Clear</button>` : ""}</div>
      ${s.help ? `<div class="help">${esc(s.help)}</div>` : ""}</div>`;
const fieldsOf = (group, skip = []) => SET.schema.filter(f => f.group === group && !skip.includes(f.key)).map(fieldRow).join("");
const SETTINGS_TABS = [
  ["ai", "AI", () => {
    const skip = SET.values.ai_provider === "openai_compatible" ? [] : ["openai_base_url", "openai_model"];
    const help = SET.values.ai_provider === "claude_subscription" ? "Uses the Claude plan you're signed in to on the computer Gus runs on, so you don't need an API key. If it has expired, sign in again here."

      : "Scoring only. Finding people and agent runs need a Claude provider.";
    const key = AI_KEYS[SET.values.ai_provider];
    return `<section class="group"><h2>AI connection</h2>${fieldRow(SET.schema.find(f => f.key === "ai_provider"))}
      ${key ? secretField([key, SET.secret_keys[key]]) : ""}
      <div class="field"><label>Connection</label><div class="row"><button onclick="testAI()">Test connection</button>${SET.values.ai_provider === "claude_subscription" ? `<button onclick="signIn('ai-login')">Sign in with Claude</button>` : ""}<span id="ai-test" class="sub"></span></div>

      <section class="group"><h2>Models and limits</h2>${fieldsOf("AI", [...skip, "ai_provider"])}</section>`;
  }],
  ["matching", "Matching", () => `<section class="group"><h2>What counts as a match</h2>${fieldsOf("Matching")}</section>`],
  ["schedule", "Schedule", () => {
    const r = SET.run, runs = [["run", "Full run"], ["scan", "Check roles"]].map(([j, l]) => {
      const x = r.last[j];
      return `<div class="field"><label>${l}</label><div class="row"><button onclick="startRun('${j}')">${r.running[j] ? "Running…" : "Run now"}</button>
        <span class="sub">${x ? `${x.ok ? "Last run" : "Had a problem"} ${ago(x.at)}: ${esc(String(x.summary).slice(-120))}` : "Not run yet"}</span></div></div>`;

    return `<section class="group"><h2>The daily run</h2><p class="sub">Full run does everything. Check roles just finds and scores new roles.</p>${runs}</section>
      <section class="group"><h2>When it runs</h2>${fieldsOf("Schedule")}</section>`;

  ["sources", "Job sources", () => `<section class="group"><h2>Job sources</h2><p class="sub">Find roles beyond your company list. Add keys in the Keys tab.</p>${fieldsOf("Job sources")}</section>
    <section class="group"><h2>Limits and timing</h2><p class="sub">Gus checks these once a day and stays within each source's allowance.</p>

  ["network", "Network", () => {

const THEMES = [["system", "System"], ["light", "Light"], ["dark", "Dark"]];

    <button class="scan-now" title="One scan: reads your job boards, feeds and email, scores new roles and maps people where there's fresh news. None of the research steps." onclick="startRun('scan')"${busy === "scan" ? " disabled" : ""}>${busy === "scan" ? "Checking…" : "Check roles"}</button>

    <span><b>${h.boards}</b> board${h.boards === 1 ? "" : "s"}</span>

    <span>Agent <b>${h.last_agent_run ? ago(h.last_agent_run) : "never"}</b></span>

function navSlim() { try { return localStorage.getItem("radar-nav") !== "open"; } catch (e) { return true; } }
function drawNav() {
  const slim = navSlim(), b = $("navToggle");
  document.querySelector(".app").classList.toggle("slim", slim);

let lastView = null, sel = 0;
function render(force) {

  if (v === "welcome" && $("fr")) return;  // it keeps itself up to date, and redrawing would wipe what you're typing
  drawTicker();
  if (!force && v === "settings" && document.activeElement && $("main").contains(document.activeElement)) return;
  if (!force && document.querySelector("#main details.keep[open], #main dialog[open]")) return;  // a form you've opened: a refresh would close it and wipe what you typed
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === v));
  $("n-week").textContent = S.moves.filter(m => m.week === S.week && m.status === "todo").length || "";

  $("n-pipeline").textContent = Object.values(S.people).filter(p => ["contacted", "replied", "conversation"].includes(p.stage)).length + S.jobs.filter(j => PIPE.slice(0, 4).includes(j.stage)).length || "";
  $("n-roles").textContent = newRoles().length || "";
  const y = window.scrollY;
  $("main").innerHTML = (V[v] || V.pipeline)();
  const full = location.hash;

function highlight(scroll) {
  const cards = [...document.querySelectorAll("article.role")];
  cards.forEach((c, i) => c.classList.toggle("sel", i === sel));
  if (scroll && cards[sel]) cards[sel].scrollIntoView({ block: "center", behavior: "smooth" });

document.addEventListener("keydown", e => {
  if (location.hash !== "#roles" || e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
  const cards = [...document.querySelectorAll("article.role")], card = cards[sel];
  const k = e.key.toLowerCase();
  if (k === "j") { sel = Math.min(sel + 1, cards.length - 1); highlight(true); }
  else if (k === "k") { sel = Math.max(sel - 1, 0); highlight(true); }
  else if (roleView !== "new") return;
  else if (card && k === "s") setStage(card.dataset.id, "shortlisted");

const STEP_MARK = { done: "✓", running: "●", failed: "✗", skipped: "–", waiting: "○" };
const JOB = {  // what each job is called while it runs, once it's done, and what it's doing
  scan: { now: "Checking roles", done: "Check roles", what: "Reading your job boards, feeds and email, then scoring anything new. Usually about 2 minutes.", link: ["#roles", "Open Role Inbox"] },
  sources: { now: "Checking job sources", done: "Job sources check", what: "Asking the job sources that are due for new roles, then scoring them. This can take a while.", link: ["#roles", "Open Role Inbox"] },
  run: { now: "Full run", done: "Full run", what: "Checks for roles, then finds and refreshes companies and plans your moves.", link: ["#week", "See this week's moves"] },
};
const jobName = (j, k) => (JOB[j] || {})[k] || j;
const elapsed = iso => {
  const t = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000)), m = Math.floor(t / 60), pad = n => String(n).padStart(2, "0");
  return t < 60 ? t + "s" : m < 60 ? `${m}m ${pad(t % 60)}s` : `${Math.floor(m / 60)}h ${pad(m % 60)}m`;
};
function seenRun() { try { return localStorage.getItem("radar-run-seen") || ""; } catch (e) { return ""; } }
function dismissRun(at) { try { localStorage.setItem("radar-run-seen", at); } catch (e) {} drawProgress(); }
function lastFinished() {  // the most recent job to finish, if it's recent and you haven't put it away
  const [job, r] = Object.entries(S.last_runs || {}).sort((a, b) => String(b[1].at).localeCompare(String(a[1].at)))[0] || [];
  return r && r.at && Date.now() - new Date(r.at) < 30 * 6e4 && r.at > seenRun() ? { job, ...r } : null;
}
function drawProgress() {
  const el = $("progress"), running = S.running || [], p = S.progress || {};
  if (running.length) {
    const job = p.job || running[0], steps = p.steps || [], queued = running.filter(j => j !== job);
    const at = steps.findIndex(x => x.status === "running"), left = steps.filter(x => x.status === "waiting").length;
    el.className = "progress"; el.hidden = false;
    document.title = `● ${jobName(job, "now")} · Gus`;
    el.innerHTML = `<div class="prog-head"><span class="prog-mark beat" aria-hidden="true">●</span><b>${esc(jobName(job, "now"))}</b>
        ${steps.length && at >= 0 ? `<span class="sub">step ${at + 1} of ${steps.length}: ${esc(steps[at].name)}</span>` : ""}
        ${p.started ? `<span class="sub">· <span id="prog-elapsed">${elapsed(p.started)}</span> so far</span>` : `<span class="sub">· starting</span>`}
        ${queued.length ? `<span class="sub">· then ${esc(queued.map(j => jobName(j, "done")).join(", "))}</span>` : ""}</div>
      ${p.now && p.now !== (steps[at] || {}).name ? `<div class="prog-now">Now: <b>${esc(p.now)}</b></div>` : ""}
      <div class="prog-what">${esc(jobName(job, "what"))} You can keep using Gus meanwhile; this updates by itself.</div>`
      + (steps.length ? `<div class="prog-steps">${steps.map(x => `<span class="step ${esc(x.status)}" title="${esc(x.detail)}">${STEP_MARK[x.status] || ""} ${esc(x.name)}${x.name === "Job sources" && x.detail ? `: ${esc(x.detail)}` : ""}</span>`).join("")}</div>` : "")
      + (steps.length ? `<div class="prog-bar" style="width:${Math.round(100 * (steps.length - left - (at >= 0 ? 0.5 : 0)) / steps.length)}%"></div>` : `<div class="prog-bar ind"></div>`);
    return;
  }

  el.hidden = !r;
  if (!r) return;
  const failed = (r.steps || []).filter(x => x.status === "failed"), [href, label] = (JOB[r.job] || {}).link || ["#roles", "Open Role Inbox"];
  el.className = "progress " + (r.ok ? "ok" : "bad");
  el.innerHTML = `<div class="prog-head"><span class="prog-mark" aria-hidden="true">${r.ok ? "✓" : "✗"}</span>
      <b>${esc(jobName(r.job, "done"))} ${r.ok ? "finished" : "didn't finish cleanly"}</b><span class="sub">${ago(r.at)}</span>
      <span class="spacer"></span>${r.ok ? `<a href="${href}" onclick="dismissRun(${jsq(r.at)})">${label}</a>` : ""}
      <button onclick="dismissRun(${jsq(r.at)})" aria-label="Dismiss">Dismiss</button></div>
    <div class="prog-what">${esc(r.summary || "")}${failed.length ? `. Failed: ${esc(failed.map(x => x.name + (x.detail ? ` (${x.detail})` : "")).join("; "))}` : ""}</div>`;
}
setInterval(() => { const e = $("prog-elapsed"); if (e && S.progress && S.progress.started) e.textContent = elapsed(S.progress.started); }, 1000);
let watching = null;
function watchRun() {  // while anything runs, check every few seconds, whoever started it
  if (watching) return;
  watching = setInterval(async () => {
    await load();
    if ((S.running || []).length) return;
    clearInterval(watching); watching = null;
    const r = lastFinished();
