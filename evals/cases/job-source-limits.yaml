id: job-source-limits
requirement: I can turn job sources on, set their limits, and see when each limit resets.
given: empty
check:
  - click "Skip for now"
  - open Settings
  - click "Job sources"
  - see "Check job sources each day"
  - see "Limits and timing"
  - see "Google Careers search"
  - see "Microsoft Careers search"
  - see "Apple Jobs search"
  - see "Mind the Product jobs"
  - see "VC job boards"
judge: Is it clear how often each source runs and how much allowance is left?
