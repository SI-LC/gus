id: skip-says-why
requirement: When I skip a role I can say why in one tap, without being made to, and Gus remembers the reason. One of the reasons is that the role itself isn't right for me, whatever the company, domain or level.
given: scanned
check:
  - open Role Inbox
  - click "Skip"
  - message says "Why?"
  - message says "Wrong level"
  - message says "Already in play at this company"
  - message says "Competitor or past employer"
  - message says "Recruiter, company not named"
  - click "The role isn't right" in the message
  - 'message says "Noted: the role isn''t right"'
  - pick "Skipped"
  - 'see "You skipped this: the role isn''t right"'
  - reload
  - open Role Inbox
  - pick "Skipped"
  - 'see "You skipped this: the role isn''t right"'
judge: Does saying why feel like part of skipping, not a form I have to fill in, and is there a reason that fits each skip without forcing it?
