id: opens-on-pipeline
requirement: The app opens on my pipeline, and on a new install it tells me how to fill it.
given: empty
check:
  - click "Skip for now"
  - see "Nothing in your pipeline yet"
  - see "Finished"
  - not see "Conversations"
  - not see "No one to contact yet this week"
judge: Is it obvious this is the pipeline, and what to do first?
