id: status-bar-counts
requirement: The status bar leads with what's waiting for me, then what Gus did this month, and keeps what the AI used on the Usage screen.
given: scanned
check:
  - status bar says "to review"
  - status bar says "to contact"
  - status bar says "in play"
  - status bar says "read from"
  - status bar says "board"
  - status bar says "saved"
  - status bar says "Check roles"
  - status bar doesn't say "tokens"
  - status bar doesn't say "api value"
  - status bar doesn't say "never"
  - status bar doesn't say "1 boards"
  - status bar doesn't say "this month"
  - status bar doesn't say "signals"
judge: Can I tell at a glance what needs me and what Gus has done, without reading every number?
