# The required check on main: a pull request can't merge until "scan" passes. The code scan and the browser checks run
# side by side, and "scan" passes only when both did.
name: Scan
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Code scan
        run: bash deploy/scan.sh
      - name: Secret scan of the full history
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks" && tar -xzf "$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Requirement checks in a real browser
        run: |
          python3 -m venv "$RUNNER_TEMP/browser"
          "$RUNNER_TEMP/browser/bin/pip" -q install -r evals/requirements.txt
          # No --with-deps: the runner already has the system libraries Chromium needs, and fetching them again from
          # Ubuntu's mirror hung the whole scan when the mirror couldn't be reached
          "$RUNNER_TEMP/browser/bin/playwright" install chromium
          "$RUNNER_TEMP/browser/bin/python" -m evals.browser
  # The name main requires. It runs even when a job above failed: a job that is skipped counts as passed on GitHub,
  # so without "always()" a failed code scan would leave this skipped and the pull request free to merge.
  scan:
    needs: [code, browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Both passed
        env:
          CODE: ${{ needs.code.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "code scan: $CODE, browser checks: $BROWSER"
          [ "$CODE" = success ] && [ "$BROWSER" = success ]
