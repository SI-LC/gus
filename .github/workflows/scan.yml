# The required check on main: a pull request can't merge until this passes.
name: Scan
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Code scan
        run: bash deploy/scan.sh
      - name: Requirement checks in a real browser
        run: |
          python3 -m venv "$RUNNER_TEMP/browser"
          "$RUNNER_TEMP/browser/bin/pip" -q install -r evals/requirements.txt
          # No --with-deps: the runner already has the system libraries Chromium needs, and fetching them again from
          # Ubuntu's mirror hung the whole scan when the mirror couldn't be reached
          "$RUNNER_TEMP/browser/bin/playwright" install chromium
          "$RUNNER_TEMP/browser/bin/python" -m evals.browser
      - name: Secret scan of the full history
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks" && tar -xzf "$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .
